[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "apns-es256"
version = "0.1.0"
description = "独立实现的 Apple Push Notification service (APNs) 客户端：ES256 provider token 签名 + HTTP/2 直连"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "李民炜 (EzioAuditoly)", email = "72021226+EzioAuditoly@users.noreply.github.com" }]
keywords = ["apns", "apple", "push", "notification", "es256", "jwt", "http2"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Communications",
    "Typing :: Typed",
]
# 核心无需任何第三方依赖：DER↔R‖S 用纯标准库实现。
dependencies = []

[project.optional-dependencies]
# ES256 签名的默认实现（也可用 signer= 注入自己的实现，从而完全不用它）
crypto = ["cryptography>=41"]
# HTTP/2 传输
httpx = ["httpx>=0.24"]
http2 = ["httpx[http2]>=0.24"]
# 最常用组合：能签名 + 能发 HTTP/2 请求
all = ["cryptography>=41", "httpx[http2]>=0.24"]
dev = ["pytest>=7", "cryptography>=41", "httpx[http2]>=0.24"]

[project.urls]
Homepage = "https://github.com/EzioAuditoly/apns-es256"
Repository = "https://github.com/EzioAuditoly/apns-es256"
Issues = "https://github.com/EzioAuditoly/apns-es256/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
apns_es256 = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 测试必须完全离线：本库的测试不得访问 Apple 端点，也不得联网。
# importlib 模式让 tests/ 与 src/ 的导入互不干扰，无需安装即可直接跑。
addopts = "-q --import-mode=importlib"
filterwarnings = ["error::DeprecationWarning"]
